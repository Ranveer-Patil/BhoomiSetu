services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: bhoomsetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bhoomsetu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhoomsetu"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  bhoomsetu_postgres:
