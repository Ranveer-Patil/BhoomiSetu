services:
  - type: web
    name: bhoomsetu-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bhoomsetu-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: bhoomsetu-db
    plan: free
    databaseName: bhoomsetu
    user: bhoomsetu
